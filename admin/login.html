<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin sign in - Virtual Try-On</title><link rel="stylesheet" href="css/app.css"></head>
<body><div class="authwrap"><form class="authcard" id="f" autocomplete="on">
<div class="logo" style="width:44px;height:44px;border-radius:14px;font-size:22px">&#128085;</div>
<h1>Admin sign in</h1><p class="muted" style="margin:0">Virtual Try-On control panel</p>
<label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
<div class="err" id="err" role="alert"></div>
<button class="btn primary" style="width:100%;margin-top:8px" id="go">Sign in</button>
</form></div>
<script src="js/common.js"></script><script src="js/login.js"></script></body></html>
